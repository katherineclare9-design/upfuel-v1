<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UpFuel</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         UPFUEL APP
         ========================= -->

    <main id="app">

        <!-- =========================
             INTRO SCREEN
             ========================= -->

        <section id="introScreen" class="screen active">

            <div class="intro-content">

                <div class="logo-container">
                    <h1 class="logo">UPFUEL</h1>
                </div>

                <div class="intro-tagline">
                    <h2>FUEL YOUR BODY.</h2>
                    <h2>POWER YOUR TRAINING.</h2>
                </div>

                <button id="introNextBtn" class="primary-btn">
                    LET'S GO
                </button>

            </div>

        </section>


        <!-- =========================
             MAIN APP
             ========================= -->

        <section id="mainApp" class="screen">

            <header class="app-header">

                <div>
                    <h1>UPFUEL</h1>

                    <p>
                        Fuel your body. Power your training.
                    </p>
                </div>

            </header>


            <!-- =========================
                 HOME PAGE
                 ========================= -->

            <div id="homePage" class="page active">

                <h2>
                    Welcome to UpFuel
                </h2>

                <p>
                    Your personalized fueling and nutrition space.
                </p>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
